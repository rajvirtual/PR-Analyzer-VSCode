name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node esbuild.mjs --production
      - run: npx vsce package --no-dependencies --allow-missing-repository --out dist/

      - uses: actions/upload-artifact@v4
        with:
          name: pr-analyzer-vsix
          path: dist/*.vsix
          if-no-files-found: error
