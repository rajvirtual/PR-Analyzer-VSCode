name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node esbuild.mjs --production
      - run: npx vsce package --no-dependencies --allow-missing-repository --out dist/

      - uses: actions/upload-artifact@v4
        with:
          name: pr-analyzer-vsix
          path: dist/*.vsix
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pr-analyzer-vsix
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.vsix
          generate_release_notes: true

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          name: pr-analyzer-vsix
          path: dist
      - name: Resolve VSIX path
        run: echo "VSIX=$(ls dist/*.vsix)" >> "$GITHUB_ENV"
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx @vscode/vsce publish --packagePath "$VSIX" --pat "$VSCE_PAT"
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish "$VSIX" --pat "$OVSX_PAT"
