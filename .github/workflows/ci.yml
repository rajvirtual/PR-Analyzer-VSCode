name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node esbuild.mjs --production
      - run: npx vsce package --no-dependencies --allow-missing-repository --out dist/

      - uses: actions/upload-artifact@v4
        with:
          name: pr-analyzer-vsix
          path: dist/*.vsix
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pr-analyzer-vsix
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.vsix
          generate_release_notes: true
